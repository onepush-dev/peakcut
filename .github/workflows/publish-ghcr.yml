name: Publish GHCR
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["Dockerfile", "railway/**", ".github/workflows/publish-ghcr.yml"]
permissions:
  contents: read
  packages: write
env:
  UPSTREAM_SHA: b3e403e27444b620a50a4ec1cf44b3afff9e9e45
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: haziqahmedqasmi/PeakCut
          ref: ${{ env.UPSTREAM_SHA }}
          path: upstream
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Upstream image (unmodified Dockerfile at the pinned commit)
        uses: docker/build-push-action@v6
        with:
          context: upstream
          push: true
          platforms: linux/amd64
          tags: ghcr.io/onepush-dev/peakcut-upstream:b3e403e
          labels: org.opencontainers.image.source=https://github.com/onepush-dev/peakcut
      - name: Railway image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: BASE=ghcr.io/onepush-dev/peakcut-upstream:b3e403e
          tags: ghcr.io/onepush-dev/peakcut:b3e403e
